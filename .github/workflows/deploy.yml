name: Verificar y desplegar

# Dos cosas en un solo workflow, y el orden importa.
#
# 1. Verificar SIEMPRE: tipos y pruebas en cada push. No depende de ningún
#    secret, así que funciona tal cual esté configurado el despliegue.
# 2. Desplegar solo si hay `VERCEL_TOKEN`.
#
# El paso 1 vale por sí solo aunque el despliegue lo haga Vercel por su cuenta
# a través de la conexión con GitHub: en ese modo Vercel publica sin comprobar
# nada, y esto es lo que avisa de que algo se rompió.
#
# Si el proyecto se conecta a Git desde el panel de Vercel, el bloque de
# despliegue de aquí sobra: se puede borrar de `deploy` hacia abajo y dejar
# solo la verificación.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

  desplegar:
    needs: verificar
    # Solo desde main, y nunca desde un pull request: el secret no debe
    # exponerse a una rama que cualquiera pueda proponer.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Sin token no se puede desplegar, pero fallar en cada push mientras no
      # esté configurado solo genera ruido. Se avisa y se sale limpio.
      - name: Comprobar que hay token
        id: guard
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            {
              echo "### Despliegue omitido (los tests sí pasaron)"
              echo ""
              echo 'No hay secret `VERCEL_TOKEN`. Es lo esperado si el'
              echo 'despliegue lo hace Vercel por su conexión con GitHub.'
              echo ''
              echo 'Si prefieres desplegar desde aquí, crea el token en'
              echo '<https://vercel.com/account/tokens> y añádelo en'
              echo 'Settings → Secrets and variables → Actions.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.guard.outputs.listo == 'si'

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.listo == 'si'
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        if: steps.guard.outputs.listo == 'si'
        run: npm ci

      # Se construye AQUÍ y se sube con `--prebuilt` en vez de dejar que Vercel
      # compile, por el mismo motivo por el que existe build-vercel.mjs: el
      # builder de Vercel no arrastra `src/` al transpilar api/index.ts.
      - name: Construir el Build Output
        if: steps.guard.outputs.listo == 'si'
        run: npm run build

      - name: Publicar en producción
        if: steps.guard.outputs.listo == 'si'
        run: |
          npx vercel deploy --prod --prebuilt --archive=tgz --yes \
            --token="${{ secrets.VERCEL_TOKEN }}"

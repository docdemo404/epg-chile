# Configuración de fuentes EPG.
#
# `priority` decide quién gana en el merge campo a campo: número más bajo gana.
# Se puede afinar por campo en `fieldPriority` más abajo.

app:
  timezone: America/Santiago
  # Días de guía a mantener hacia adelante (0 = solo hoy).
  daysAhead: 3
  # Días de guía pasada que se conservan antes de purgar.
  daysBehind: 1
  userAgent: "api-epg-cl/1.0 (+agregador EPG personal)"

sources:
  # Nota sobre `priority`: decide qué fuente FIJA el horario de un canal
  # cubierto por varias. Manda el orden, no el volumen de datos — los
  # agregadores encadenan emisiones sin huecos y siempre parecen cubrir más
  # que el EPG del operador, que sí deja huecos reales.

  - id: movistar
    enabled: true
    priority: 1
    # La fuente más rica: descripción, elenco, géneros, rating por edad.
    baseUrl: https://contentapi-cl.cdn.telefonica.com
    instance: "26"
    catalog: default
    language: es-CL
    referer: https://movistartv.cl/
    # Canales por request de /schedules. Subirlo acorta la ingesta pero
    # alarga la URL; 20 va holgado por debajo del límite del gateway.
    channelBatchSize: 20
    # Ventana temporal por request, en horas.
    windowHours: 6
    rateLimit:
      concurrency: 3
      minDelayMs: 250
    refreshCron: "0 */6 * * *"

  - id: zapping
    enabled: false
    priority: 2
    # DESACTIVADA: geobloqueo a Chile, incompatible con la ingesta en la nube.
    #
    # El sitio responde 403 con el cuerpo "Acceso denegado: País no permitido"
    # a cualquier IP fuera de Chile. Medido desde el runner de GitHub Actions
    # (Azure westus3, EE.UU.): 403. Desde una conexión residencial chilena:
    # 200 y los 177 canales completos. No es anti-bot ni depende del
    # User-Agent —el origen es nginx pelado, sin WAF—, es el país de origen.
    #
    # Como la ingesta pesada vive en Actions y no hay cómputo gratuito con
    # salida en Chile, la fuente fallaba en cada corrida. Reactivarla exige
    # ingerir desde una IP chilena: una máquina local o un despliegue en una
    # región de Santiago (GCP southamerica-west1, Oracle sa-santiago-1).
    #
    # No se implementa evasión del geobloqueo, por la misma razón que no se
    # implementa evasión del anti-bot de DirecTV.
    #
    # Qué se pierde, medido sobre la guía fusionada de 26.558 emisiones:
    # 2.453 emisiones exclusivas (9,2 %) repartidas en ~76 canales que
    # ninguna otra fuente trae. En metadatos de programas compartidos no
    # aportaba nada: 0 en elenco, categoría, episodio, rating y subtítulo.
    # El elenco con personaje —su ventaja teórica— requiere fetchDetails y
    # estaba apagado, así que nunca llegó a la guía.
    #
    # Limitación adicional, si algún día se reactiva: cada página cubre desde
    # ahora hasta ~30 h adelante y no acepta parámetro de fecha, así que
    # enriquece la franja cercana y la guía a varios días la sostiene
    # Movistar.
    baseUrl: https://guia.zappingtv.com
    # El elenco solo está en la ficha de cada programa: una petición por
    # emisión (~4.000 por ejecución). Activar solo si se quiere ese detalle
    # y asumiendo el coste en tiempo y en carga sobre el sitio.
    fetchDetails: false
    rateLimit:
      concurrency: 2
      minDelayMs: 600
    refreshCron: "20 */6 * * *"

  - id: broadcasters
    enabled: true
    # Deliberadamente NO es prioridad 1, pese a ser fuente de primera mano.
    #
    # `priority` decide quién posee la línea de tiempo del canal, y las
    # emisoras publican solo el título: cero sinopsis, cero categorías, cero
    # elenco. Al ponerlas por delante, Canal 13 se quedaba con una guía de
    # títulos sueltos porque se descartaban las emisiones de Movistar que no
    # casaban exactamente en horario, y con ellas toda su metadata.
    #
    # El sitio correcto para su autoridad es `fieldPriority.title`, más abajo:
    # corrigen el título oficial de las emisiones que sí casan y rellenan los
    # huecos que deje la fuente principal, sin secuestrar la parrilla.
    priority: 3
    # Parrillas publicadas por las propias emisoras chilenas: van por delante
    # de los operadores ante cambios de última hora.
    #
    # Mega redacta su parrilla dentro de una nota editorial en vez de una
    # grilla: es el parser más frágil y puede dejar de aportar si cambia la
    # redacción, sin afectar al resto de la guía.
    baseUrl: https://www.mega.cl
    broadcasters: [mega, canal13, lared]
    rateLimit:
      concurrency: 1
      minDelayMs: 1000
    refreshCron: "50 */8 * * *"

  - id: uploads
    enabled: true
    # Archivos que subes desde el panel (XMLTV, .xml.gz o el JSON que exporta
    # este proyecto). Prioridad alta a propósito: si te tomas el trabajo de
    # subir una guía es porque sabes algo que las fuentes automáticas no.
    #
    # Viven en config/uploads/ para poder versionarlos en el repo.
    priority: 2
    baseUrl: file://config/uploads
    rateLimit:
      concurrency: 1
      minDelayMs: 0
    # Son archivos locales: no hay nada que descargar en un cron.
    refreshCron: ""

  - id: directv
    # DESHABILITADA: la guía de DirecTV está protegida por Radware Bot Manager
    # y responde con un desafío de JavaScript a cualquier cliente automatizado.
    # No se implementa evasión del control anti-bot. El adaptador queda escrito
    # por si el acceso se abre en el futuro.
    #
    # Reinvestigado el 2026-07-28 desde una conexión residencial chilena. El
    # dato existe y el adaptador es correcto —el grabber de iptv-org/epg para
    # DirecTV AR/UY usa el mismo método y las mismas dos trampas que ya están
    # implementadas—; lo único que falta es pasar el anti-bot, y eso solo lo
    # logra un navegador que ejecute el JS del desafío. Medido, todo con
    # User-Agent identificable:
    #
    #  - Todo el host responde 302 a validate.perfdrive.com: guia.aspx, /guia/,
    #    /movil/ProgramGuide y directv.cl sin www. Solo robots.txt y
    #    sitemap.xml pasan.
    #  - La guía migró a directvla.com/cl, detrás del mismo WAF. El baseUrl de
    #    abajo apunta al host antiguo; da igual, ambos bloquean.
    #  - Suplantar el User-Agent como Chrome no alcanza: sigue el 302.
    #  - Sin tolerancia por sesión: tres tarros de cookies limpios, tres
    #    bloqueos. No hay margen para un goteo lento y cortés.
    #  - Los sitios hermanos (.com.ar, .com.co, .com.pe, .com.ec, .com.uy)
    #    escalan al mismo desafío, y cada despliegue sirve la grilla de su
    #    país: PGCulture=es-CL sobre el host argentino no cambia el catálogo.
    #  - DGO no es alcanzable desde aquí y su guía exige suscripción.
    #
    # Reactivar exige que DirecTV abra el acceso. Mientras tanto, las vías
    # legítimas para meter esta guía son las que ya ofrece el panel: subir un
    # XMLTV o registrar una guía remota por URL.
    #
    # Para el día que se abra: existe guia/ChannelDetail.aspx/GetProgramming,
    # que devuelve un día completo de un canal en una sola petición en vez de
    # bloques de 3 horas. Renombra el contenedor a `filterParameters` y añade
    # isChannelDetails: "Y", channelNum y channelName, con time: 0. Puede que
    # ese endpoint sí traiga la sinopsis que el de bloques deja vacía; sin
    # acceso no se pudo verificar.
    enabled: false
    priority: 9
    baseUrl: https://www.directv.cl
    # La grilla se sirve en bloques de 3 horas.
    blockHours: 3
    rateLimit:
      concurrency: 2
      minDelayMs: 400
    refreshCron: "20 */6 * * *"

  - id: weekly
    enabled: true
    # Canales de parrilla FIJA: la misma programación cada semana.
    #
    # Los canales locales pequeños no salen en ningún operador ni tienen web
    # que scrapear, pero sí publican un horario semanal que se repite. Esta
    # fuente lo expande a fechas concretas dentro de la ventana de la guía.
    #
    # `priority` va por detrás de las fuentes con horarios reales a propósito:
    # una parrilla fija describe la intención del canal, no lo que se emitió.
    # Si algún día un operador trae uno de estos canales, que mande su EPG y
    # que la parrilla fija se quede rellenando los huecos.
    priority: 5
    # No hay host común: cada canal declara la URL de su parrilla.
    baseUrl: ""
    channels:
      - id: diferencia-tv
        name: Diferencia TV
        fullName: Diferencia Radio TV
        logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrIcYWOMKeKkDhpwrMtexgfphxmiGkn2yEMTxC0YtjMA&s=10"
        # El horario vive fuera del repo: se vuelve a descargar en cada
        # ingesta, así que editarlo ahí basta para cambiar la guía.
        url: https://snippet.host/ohhpkx/raw
    rateLimit:
      concurrency: 1
      minDelayMs: 500
    refreshCron: "15 */12 * * *"

  - id: tivify
    enabled: true
    # AISLADA: son canales de ESPAÑA, no de Chile.
    #
    # `isolated` la saca por completo de la unificación: sus canales no se
    # emparejan con los de ninguna otra fuente —ni por alias manual— y, al no
    # compartir canal unificado, tampoco intercambian metadatos en el merge.
    # La guía española queda al lado de la chilena, nunca mezclada con ella.
    #
    # Sin esa frontera el emparejado difuso las cruzaría: "La 1" contra "La
    # Red", "TV3" contra "TV+", y saldría un canal con media parrilla de cada
    # país. El nombre es la única señal que hay para vincular canales, y entre
    # dos países distintos esa señal miente.
    isolated: true
    # Los ids XMLTV terminan en `.es` en vez de `.cl`, así que la separación
    # también es visible en el archivo y no puede haber colisión de ids.
    xmltvSuffix: es
    ratingSystem: ES
    # `priority` aquí casi no decide nada —no compite con nadie por la
    # parrilla de un canal—: solo ordena esta fuente en el panel.
    priority: 6
    # www.tivify.tv es una SPA sin HTML útil: la guía sale del CDN de TVUP,
    # que es de donde la lee la propia web. Un archivo JSON por día cubre los
    # ~314 canales, así que es la fuente más barata en peticiones y la más
    # cara en bytes: 10-15 MB por día. De ahí el cron espaciado.
    baseUrl: https://mediasync.tvup.cloud
    # Host de imágenes: las rutas del JSON son relativas a él.
    mediaUrl: https://media.tvup.cloud
    # Carrier anónimo, el que ve quien entra a tivify.tv sin cuenta. Está en
    # el bundle de la web como `anonymous.carrierId`; no hay autenticación.
    carrierId: "5ea94948bf8cbb0072c89fa6"
    # Idioma de los diccionarios de género y categoría (llegan como ids).
    language: es
    rateLimit:
      concurrency: 1
      minDelayMs: 500
    refreshCron: "30 */8 * * *"

  - id: mitv
    enabled: true
    priority: 4
    # Relleno adicional de sinopsis. Un request por canal y día:
    # es la fuente más costosa y la que exige más cortesía.
    baseUrl: https://mi.tv
    country: cl
    rateLimit:
      concurrency: 2
      minDelayMs: 1200
    refreshCron: "40 */12 * * *"

# Prioridad por campo. Sobrescribe el `priority` global de cada fuente.
# El primero de la lista que traiga un valor no vacío gana.
#
# `tivify` no aparece en ninguna lista y no es un olvido: está aislada, así que
# nunca comparte emisión con otra fuente y no hay prioridad que resolver.
fieldPriority:
  # El título oficial lo pone quien emite; las emisoras van primero en su señal.
  title: [uploads, broadcasters, movistar, zapping, mitv]
  # Movistar tiene sinopsis en el 96% de sus emisiones: es la mejor con
  # diferencia. Las emisoras no publican sinopsis, así que van al final.
  desc: [uploads, movistar, zapping, mitv, broadcasters]
  subTitle: [mitv, movistar, zapping]
  categories: [movistar, zapping, mitv]
  # Zapping es la única que da el personaje de cada actor, pero solo si
  # fetchDetails está activo; si no, Movistar aporta el reparto.
  credits: [movistar, zapping, mitv]
  rating: [movistar, mitv, zapping]
  episode: [mitv, movistar, zapping]
  # Para imágenes no manda el orden sino la mayor resolución disponible;
  # esta lista solo resuelve empates.
  images: [zapping, movistar, mitv, broadcasters]

matching:
  # Umbral de similitud (coeficiente de Dice) para vincular canales
  # automáticamente. Por debajo de esto queda pendiente de revisión manual.
  channelNameThreshold: 0.82
  # Tolerancia al emparejar programas entre fuentes.
  programme:
    # Solape mínimo entre dos emisiones para considerarlas el mismo programa.
    minOverlapRatio: 0.5
    # Desfase máximo tolerado entre horas de inicio, en minutos.
    maxStartDriftMinutes: 15
    titleThreshold: 0.72

http:
  timeoutMs: 30000
  retries: 3
  # Backoff exponencial: delay = backoffBaseMs * 2^intento
  backoffBaseMs: 1000
  cacheTtlMinutes: 30
